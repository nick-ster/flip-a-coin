<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>flip a coin - Google Search</title>
<link rel="apple-touch-icon" href="icon.jpg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Google">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: arial, sans-serif;
    background: #fff;
    max-width: 430px;
    margin: 0 auto;
    overflow-x: hidden;
  }

  /* Screenshot top image */
  .google-top-screenshot {
    width: 100%;
    display: block;
  }

  /* Coin area — teal background */
  .coin-area {
    background: #48d1cc;
    min-height: 230px;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 24px 0 20px;
    position: relative; overflow: hidden;
    cursor: pointer; user-select: none;
  }

  /* Coin */
  .coin-container {
    perspective: 600px;
    width: 160px; height: 160px;
    margin-bottom: 14px;
  }
  .coin {
    width: 160px; height: 160px;
    position: relative;
    transform-style: preserve-3d;
  }
  .coin.flipping-forward {
    animation: coinFlipForward 0.9s cubic-bezier(0.4,0,0.2,1) forwards;
  }
  .coin.flipping-reverse {
    animation: coinFlipReverse 0.9s cubic-bezier(0.4,0,0.2,1) forwards;
  }
  @keyframes coinFlipForward {
    0%   { transform: rotateY(0deg) scaleY(1); }
    15%  { transform: rotateY(90deg) scaleY(0.8); }
    30%  { transform: rotateY(180deg) scaleY(1); }
    45%  { transform: rotateY(270deg) scaleY(0.8); }
    60%  { transform: rotateY(360deg) scaleY(1); }
    75%  { transform: rotateY(450deg) scaleY(0.85); }
    88%  { transform: rotateY(520deg) scaleY(1); }
    94%  { transform: rotateY(540deg) scaleY(0.97); }
    100% { transform: rotateY(540deg) scaleY(1); }
  }
  @keyframes coinFlipReverse {
    0%   { transform: rotateY(0deg) scaleY(1); }
    15%  { transform: rotateY(-90deg) scaleY(0.8); }
    30%  { transform: rotateY(-180deg) scaleY(1); }
    45%  { transform: rotateY(-270deg) scaleY(0.8); }
    60%  { transform: rotateY(-360deg) scaleY(1); }
    75%  { transform: rotateY(-450deg) scaleY(0.85); }
    88%  { transform: rotateY(-520deg) scaleY(1); }
    94%  { transform: rotateY(-540deg) scaleY(0.97); }
    100% { transform: rotateY(-540deg) scaleY(1); }
  }

  .coin-face {
    width: 160px; height: 160px;
    border-radius: 50%; overflow: hidden;
    box-shadow:
      0 6px 20px rgba(0,0,0,0.3),
      0 2px 6px rgba(0,0,0,0.15);
  }
  .coin-face img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: block;
  }

  .coin-label {
    font-size: 28px; font-weight: 400; color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.2);
    letter-spacing: 0.3px;
  }

  /* Touch zones */
  .touch-zones {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; z-index: 10;
  }
  .touch-zone-left, .touch-zone-right { flex: 1; height: 100%; }

  /* Flip again */
  .flip-again {
    text-align: center; padding: 14px 16px;
    font-size: 13.5px; font-weight: 500;
    color: #1a73e8; letter-spacing: 0.8px;
    cursor: pointer; border-bottom: 1px solid #e8eaed;
    background: #fff;
  }
  .flip-again:active { background: #f1f3f4; }

  /* Tools tabs */
  .tools-tabs {
    display: flex; border-bottom: 1px solid #e8eaed;
    padding: 0 16px; background: #fff;
  }
  .tools-tab {
    flex: 1; text-align: center; padding: 12px 0;
    font-size: 11.5px; color: #5f6368; letter-spacing: 0.6px;
    text-transform: uppercase; font-weight: 500; cursor: pointer;
  }
  .tools-tab.active {
    color: #1a73e8; border-bottom: 3px solid #1a73e8;
  }

  /* Tool cards */
  .tool-cards {
    display: flex; gap: 8px; padding: 12px 12px;
    overflow-x: auto; scrollbar-width: none; background: #fff;
  }
  .tool-cards::-webkit-scrollbar { display: none; }
  .tool-card {
    min-width: 88px; height: 88px; border-radius: 12px;
    display: flex; flex-direction: column; align-items: center;
    justify-content: flex-end; padding-bottom: 10px;
    flex-shrink: 0; overflow: hidden; position: relative;
    cursor: pointer;
  }
  .card-tuner { background: linear-gradient(135deg, #e67e22, #d35400); }
  .card-calc { background: linear-gradient(135deg, #5b9bd5, #3a7fc1); }
  .card-meditate { background: linear-gradient(135deg, #6bb5e8, #4a9fd4); }
  .card-roll { background: #e8e8e8; }
  .card-label { font-size: 11px; color: #fff; font-weight: 400; z-index: 1; }
  .card-roll .card-label { color: #202124; }
  .card-icon { font-size: 34px; position: absolute; top: 10px; }

  /* Show less */
  .show-less {
    text-align: center; padding: 14px;
    font-size: 14px; color: #5f6368; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    border-top: 1px solid #e8eaed; background: #fff;
  }

  /* Bottom nav */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #fff; border-top: 1px solid #e8eaed;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 20px 24px;
    max-width: 430px; margin: 0 auto;
  }
  .nav-btn { font-size: 22px; color: #5f6368; cursor: pointer; padding: 4px; }
  .nav-plus {
    width: 36px; height: 36px; border-radius: 50%;
    border: 1.5px solid #dadce0; display: flex; align-items: center;
    justify-content: center; font-size: 20px; color: #5f6368; cursor: pointer;
  }
  .nav-tabs {
    border: 1.5px solid #5f6368; border-radius: 6px;
    padding: 2px 8px; font-size: 13px; color: #202124; font-weight: 600;
  }

</style>
</head>
<body>

<!-- Screenshot of Google top (static image) -->
<img class="google-top-screenshot" src="google-top.jpg" alt="Google Search">

<!-- Coin area -->
<div class="coin-area" id="coinArea">
  <div class="coin-container">
    <div class="coin" id="coin">
      <div class="coin-face">
        <img id="coinImg" src="heads.jpg" alt="Heads">
      </div>
    </div>
  </div>
  <div class="coin-label" id="coinLabel">Heads</div>

  <!-- Invisible touch zones: left=tails, right=heads -->
  <div class="touch-zones">
    <div class="touch-zone-left" id="zoneTails"></div>
    <div class="touch-zone-right" id="zoneHeads"></div>
  </div>
</div>

<!-- Flip Again bar -->
<div id="flipAgain" style="
  text-align:center; padding:14px 16px;
  font-size:13.5px; font-weight:500;
  color:#1a73e8; letter-spacing:0.8px;
  cursor:pointer; border-bottom:1px solid #e8eaed;
  background:#fff; font-family:arial,sans-serif;
  min-height:48px; display:flex; align-items:center; justify-content:center;
">FLIP AGAIN</div>

<!-- Bottom screenshot -->
<img style="width:100%; display:block;" src="google-bottom.jpg" alt="Google Bottom">

<script>
  const coin = document.getElementById('coin');
  const coinLabel = document.getElementById('coinLabel');
  const coinImg = document.getElementById('coinImg');
  const flipAgainBtn = document.getElementById('flipAgain');
  let isFlipping = false;
  let flipDirection = 1; // alternates each flip

  function flip(result) {
    if (isFlipping) return;
    isFlipping = true;

    // Show "Flipping..."
    coinLabel.textContent = 'Flipping...';
    flipAgainBtn.textContent = 'Flipping...';

    // Alternate direction
    const animClass = flipDirection === 1 ? 'flipping-forward' : 'flipping-reverse';
    flipDirection *= -1;

    coin.classList.remove('flipping-forward', 'flipping-reverse');
    void coin.offsetWidth;
    coin.classList.add(animClass);

    // Swap image at midpoint
    setTimeout(() => {
      coinImg.src = result === 'heads' ? 'heads.jpg' : 'tails.jpg';
    }, 450);

    setTimeout(() => {
      coinLabel.textContent = result === 'heads' ? 'Heads' : 'Tails';
      flipAgainBtn.textContent = 'FLIP AGAIN';
      coin.classList.remove('flipping-forward', 'flipping-reverse');
      isFlipping = false;
    }, 900);
  }

  document.getElementById('zoneHeads').addEventListener('click', () => flip('heads'));
  document.getElementById('zoneTails').addEventListener('click', () => flip('tails'));
  flipAgainBtn.addEventListener('click', () => {
    flip(Math.random() < 0.5 ? 'heads' : 'tails');
  });

  // Auto-flip on open
  setTimeout(() => flip(Math.random() < 0.5 ? 'heads' : 'tails'), 300);
</script>
</body>
</html>
