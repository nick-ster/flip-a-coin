    width: 100%;
    display: block;
  }

  /* Coin area — exact Google teal */
  .coin-area {
    background: rgb(77, 208, 225);
    height: 212px;
    display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start;
    padding-top: 15px;
    position: relative; overflow: hidden;
    cursor: pointer; user-select: none;
  }

  /* Coin */
  .coin-container {
    perspective: 600px;
    width: 160px; height: 160px;
    margin-bottom: 14px;
  }
  .coin {
    width: 160px; height: 160px;
    position: relative;
    transform-style: preserve-3d;
  }
  /* Google sprite-sheet coin */
  .coin-container {
    width: 150px; height: 150px;
    margin: 0 auto 0;
    position: relative;
    overflow: hidden;
  }
  .coin-container.tilt-3pm {
    animation: tilt3pm 1.8s ease-in-out forwards;
  }
  .coin-container.tilt-9pm {
    animation: tilt9pm 1.8s ease-in-out forwards;
  }
  /* 1 o'clock = tilt top-right down, bottom-left up */
  @keyframes tilt3pm {
    0%   { transform: rotateX(0deg) rotateZ(0deg); }
    15%  { transform: rotateX(-12deg) rotateZ(-8deg); }
    50%  { transform: rotateX(12deg) rotateZ(8deg); }
    85%  { transform: rotateX(-6deg) rotateZ(-4deg); }
    100% { transform: rotateX(0deg) rotateZ(0deg); }
  }
  /* 11 o'clock = tilt top-left down, bottom-right up */
  @keyframes tilt9pm {
    0%   { transform: rotateX(0deg) rotateZ(0deg); }
    15%  { transform: rotateX(-12deg) rotateZ(8deg); }
    50%  { transform: rotateX(12deg) rotateZ(-8deg); }
    85%  { transform: rotateX(-6deg) rotateZ(4deg); }
    100% { transform: rotateX(0deg) rotateZ(0deg); }
  }
  .coin-sprite {
    width: 150px;
    height: 2699px;
    display: block;
  }
  .coin-sprite.flip-fwd-heads {
    animation: flipFwdHeads 1.8s steps(1) forwards;
  }
  .coin-sprite.flip-fwd-tails {
    animation: flipFwdTails 1.8s steps(1) forwards;
  }
  .coin-sprite.flip-rev-heads {
    animation: flipRevHeads 1.8s steps(1) forwards;

  .coin-sprite.flip-rev-tails {
    animation: flipRevTails 1.8s steps(1) forwards;

  /* Touch zones */

  /* Flip again */

<body>

<!-- Screenshot of Google top (static image) -->
<img class="google-top-screenshot" src="google-top.jpg" alt="Google Search">

<!-- Coin area -->
<div class="coin-area" id="coinArea">
  <div class="coin-container">
    <img class="coin-sprite" id="coin" src="coin_sheet.png" alt="coin">
  </div>
  <div class="coin-label" id="coinLabel">Heads</div>

  <!-- Invisible touch zones: left=tails, right=heads -->
  <div class="touch-zones">
    <div class="touch-zone-left" id="zoneTails"></div>
    <div class="touch-zone-right" id="zoneHeads"></div>
  </div>
</div>

<!-- Flip Again screenshot (clickable, swaps during flip) -->
<div style="position:relative; line-height:0;">
  <img id="flipAgainImg" style="width:100%; display:block; transition: opacity 0.15s ease;" src="bottom-flipagain.jpg" alt="Flip Again">
  <div id="flipAgain" style="position:absolute;top:0;left:0;right:0;bottom:0;cursor:pointer;"></div>
</div>

<!-- Tools screenshot (no gap) -->
<img style="width:100%; display:block;" src="bottom-tools.jpg" alt="Tools">

<script>
  const coin = document.getElementById('coin');
  const coinLabel = document.getElementById('coinLabel');
  const flipAgainBtn = document.getElementById('flipAgain');
  const flipAgainImg = document.getElementById('flipAgainImg');
  let isFlipping = false;
  let flipDirection = 1;

  function flip(result) {
    if (isFlipping) return;
    isFlipping = true;

    coinLabel.classList.remove('visible');
    flipAgainImg.src = 'bottom-flipping.jpg';

    const dir = flipDirection === 1 ? 'fwd' : 'rev';
    const tilt = flipDirection === 1 ? 'tilt-3pm' : 'tilt-9pm';
    flipDirection *= -1;
    const animClass = `flip-${dir}-${result}`;

    const container = document.querySelector('.coin-container');
    coin.classList.remove('flip-fwd-heads','flip-fwd-tails','flip-rev-heads','flip-rev-tails');
    container.classList.remove('tilt-3pm','tilt-9pm');
    coin.style.transform = '';
    void coin.offsetWidth;
    coin.classList.add(animClass);
    container.classList.add(tilt);

    setTimeout(() => {
      // Animation already ends on correct frame via forwards fill — no snap needed
      coinLabel.textContent = result === 'heads' ? 'Heads' : 'Tails';
      coinLabel.classList.add('visible');
      flipAgainImg.src = 'bottom-flipagain.jpg';
      isFlipping = false;
    }, 1800);
  }


  document.getElementById('zoneHeads').addEventListener('click', () => flip('heads'));
  document.getElementById('zoneTails').addEventListener('click', () => flip('tails'));
  flipAgainBtn.addEventListener('click', () => {
    flip(Math.random() < 0.5 ? 'heads' : 'tails');
  });

  // Auto-flip on open
  setTimeout(() => flip(Math.random() < 0.5 ? 'heads' : 'tails'), 300);
</script>
