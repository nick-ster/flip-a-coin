<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>flip a coin - Google Search</title>
<link rel="apple-touch-icon" href="icon.jpg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Google">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: arial, sans-serif;
    background: #fff;
    max-width: 430px;
    margin: 0 auto;
    overflow-x: hidden;
  }

  /* Screenshot top image */
  .google-top-screenshot {
    width: 100%;
    display: block;
  }

  /* Coin area — exact Google teal */
  .coin-area {
    background: rgb(77, 208, 225);
    height: 212px;
    display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start;
    padding-top: 15px;
    position: relative; overflow: hidden;
    cursor: pointer; user-select: none;
  }

  /* Coin */
  .coin-container {
    perspective: 600px;
    width: 160px; height: 160px;
    margin-bottom: 14px;
  }
  .coin {
    width: 160px; height: 160px;
    position: relative;
    transform-style: preserve-3d;
  }
  /* Google sprite-sheet coin — exact replica */
  .coin-container {
    width: 150px; height: 150px;
    margin: 0 auto 0;
    position: relative;
    overflow: hidden;
  }
  .coin-sprite {
    width: 150px;
    height: 2699px;
    display: block;
  }
  .coin-sprite.flipping-forward {
    animation: coinFlipForward 1.4s steps(1) forwards;
  }
  .coin-sprite.flipping-reverse {
    animation: coinFlipReverse 1.4s steps(1) forwards;
  }

  /* 3 full cycles forward (54 steps total), then hold on frame 0 */
  @keyframes coinFlipForward {
    /* cycle 1 */
    0%     { transform: translateY(0px); }
    1.85%  { transform: translateY(-150px); }
    3.7%   { transform: translateY(-300px); }
    5.55%  { transform: translateY(-450px); }
    7.4%   { transform: translateY(-600px); }
    9.25%  { transform: translateY(-750px); }
    11.1%  { transform: translateY(-900px); }
    12.95% { transform: translateY(-1050px); }
    14.8%  { transform: translateY(-1200px); }
    16.65% { transform: translateY(-1349px); }
    18.5%  { transform: translateY(-1499px); }
    20.35% { transform: translateY(-1649px); }
    22.2%  { transform: translateY(-1799px); }
    24.05% { transform: translateY(-1949px); }
    25.9%  { transform: translateY(-2099px); }
    27.75% { transform: translateY(-2249px); }
    29.6%  { transform: translateY(-2399px); }
    31.45% { transform: translateY(-2549px); }
    /* cycle 2 — back to top */
    33.3%  { transform: translateY(0px); }
    35.15% { transform: translateY(-150px); }
    37%    { transform: translateY(-300px); }
    38.85% { transform: translateY(-450px); }
    40.7%  { transform: translateY(-600px); }
    42.55% { transform: translateY(-750px); }
    44.4%  { transform: translateY(-900px); }
    46.25% { transform: translateY(-1050px); }
    48.1%  { transform: translateY(-1200px); }
    49.95% { transform: translateY(-1349px); }
    51.8%  { transform: translateY(-1499px); }
    53.65% { transform: translateY(-1649px); }
    55.5%  { transform: translateY(-1799px); }
    57.35% { transform: translateY(-1949px); }
    59.2%  { transform: translateY(-2099px); }
    61.05% { transform: translateY(-2249px); }
    62.9%  { transform: translateY(-2399px); }
    64.75% { transform: translateY(-2549px); }
    /* cycle 3 — landing cycle (slower) */
    66.6%  { transform: translateY(0px); }
    69.5%  { transform: translateY(-150px); }
    72.4%  { transform: translateY(-300px); }
    75.3%  { transform: translateY(-450px); }
    78.2%  { transform: translateY(-600px); }
    81.1%  { transform: translateY(-750px); }
    84%    { transform: translateY(-900px); }
    86.9%  { transform: translateY(-1050px); }
    89.8%  { transform: translateY(-1200px); }
    92.7%  { transform: translateY(-1349px); }
    95.6%  { transform: translateY(-1499px); }
    98.5%  { transform: translateY(-150px); }
    100%   { transform: translateY(0px); }
  }

  /* 3 full cycles reverse (bottom→top), land on last frame */
  @keyframes coinFlipReverse {
    /* cycle 1 */
    0%     { transform: translateY(-2549px); }
    1.85%  { transform: translateY(-2399px); }
    3.7%   { transform: translateY(-2249px); }
    5.55%  { transform: translateY(-2099px); }
    7.4%   { transform: translateY(-1949px); }
    9.25%  { transform: translateY(-1799px); }
    11.1%  { transform: translateY(-1649px); }
    12.95% { transform: translateY(-1499px); }
    14.8%  { transform: translateY(-1349px); }
    16.65% { transform: translateY(-1200px); }
    18.5%  { transform: translateY(-1050px); }
    20.35% { transform: translateY(-900px); }
    22.2%  { transform: translateY(-750px); }
    24.05% { transform: translateY(-600px); }
    25.9%  { transform: translateY(-450px); }
    27.75% { transform: translateY(-300px); }
    29.6%  { transform: translateY(-150px); }
    31.45% { transform: translateY(0px); }
    /* cycle 2 */
    33.3%  { transform: translateY(-2549px); }
    35.15% { transform: translateY(-2399px); }
    37%    { transform: translateY(-2249px); }
    38.85% { transform: translateY(-2099px); }
    40.7%  { transform: translateY(-1949px); }
    42.55% { transform: translateY(-1799px); }
    44.4%  { transform: translateY(-1649px); }
    46.25% { transform: translateY(-1499px); }
    48.1%  { transform: translateY(-1349px); }
    49.95% { transform: translateY(-1200px); }
    51.8%  { transform: translateY(-1050px); }
    53.65% { transform: translateY(-900px); }
    55.5%  { transform: translateY(-750px); }
    57.35% { transform: translateY(-600px); }
    59.2%  { transform: translateY(-450px); }
    61.05% { transform: translateY(-300px); }
    62.9%  { transform: translateY(-150px); }
    64.75% { transform: translateY(0px); }
    /* cycle 3 — slower landing */
    66.6%  { transform: translateY(-2549px); }
    69.5%  { transform: translateY(-2399px); }
    72.4%  { transform: translateY(-2249px); }
    75.3%  { transform: translateY(-2099px); }
    78.2%  { transform: translateY(-1949px); }
    81.1%  { transform: translateY(-1799px); }
    84%    { transform: translateY(-1649px); }
    86.9%  { transform: translateY(-1499px); }
    89.8%  { transform: translateY(-1349px); }
    92.7%  { transform: translateY(-1200px); }
    95.6%  { transform: translateY(-1050px); }
    98.5%  { transform: translateY(-2399px); }
    100%   { transform: translateY(-2549px); }
  }

  .coin-label {
    font-size: 17px; font-weight: 300; color: #fff;
    font-family: arial, sans-serif;
    letter-spacing: 0;
    margin-top: 16px;
    opacity: 0;
    transition: opacity 0.4s ease;
    height: 30px; line-height: 30px;
  }
  .coin-label.visible {
    opacity: 1;
  }

  /* Touch zones */
  .touch-zones {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; z-index: 10;
  }
  .touch-zone-left, .touch-zone-right { flex: 1; height: 100%; }

  /* Flip again */
  .flip-again {
    text-align: center; padding: 14px 16px;
    font-size: 13.5px; font-weight: 500;
    color: #1a73e8; letter-spacing: 0.8px;
    cursor: pointer; border-bottom: 1px solid #e8eaed;
    background: #fff;
  }
  .flip-again:active { background: #f1f3f4; }

  /* Tools tabs */
  .tools-tabs {
    display: flex; border-bottom: 1px solid #e8eaed;
    padding: 0 16px; background: #fff;
  }
  .tools-tab {
    flex: 1; text-align: center; padding: 12px 0;
    font-size: 11.5px; color: #5f6368; letter-spacing: 0.6px;
    text-transform: uppercase; font-weight: 500; cursor: pointer;
  }
  .tools-tab.active {
    color: #1a73e8; border-bottom: 3px solid #1a73e8;
  }

  /* Tool cards */
  .tool-cards {
    display: flex; gap: 8px; padding: 12px 12px;
    overflow-x: auto; scrollbar-width: none; background: #fff;
  }
  .tool-cards::-webkit-scrollbar { display: none; }
  .tool-card {
    min-width: 88px; height: 88px; border-radius: 12px;
    display: flex; flex-direction: column; align-items: center;
    justify-content: flex-end; padding-bottom: 10px;
    flex-shrink: 0; overflow: hidden; position: relative;
    cursor: pointer;
  }
  .card-tuner { background: linear-gradient(135deg, #e67e22, #d35400); }
  .card-calc { background: linear-gradient(135deg, #5b9bd5, #3a7fc1); }
  .card-meditate { background: linear-gradient(135deg, #6bb5e8, #4a9fd4); }
  .card-roll { background: #e8e8e8; }
  .card-label { font-size: 11px; color: #fff; font-weight: 400; z-index: 1; }
  .card-roll .card-label { color: #202124; }
  .card-icon { font-size: 34px; position: absolute; top: 10px; }

  /* Show less */
  .show-less {
    text-align: center; padding: 14px;
    font-size: 14px; color: #5f6368; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    border-top: 1px solid #e8eaed; background: #fff;
  }

  /* Bottom nav */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #fff; border-top: 1px solid #e8eaed;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 20px 24px;
    max-width: 430px; margin: 0 auto;
  }
  .nav-btn { font-size: 22px; color: #5f6368; cursor: pointer; padding: 4px; }
  .nav-plus {
    width: 36px; height: 36px; border-radius: 50%;
    border: 1.5px solid #dadce0; display: flex; align-items: center;
    justify-content: center; font-size: 20px; color: #5f6368; cursor: pointer;
  }
  .nav-tabs {
    border: 1.5px solid #5f6368; border-radius: 6px;
    padding: 2px 8px; font-size: 13px; color: #202124; font-weight: 600;
  }

</style>
</head>
<body>

<!-- Screenshot of Google top (static image) -->
<img class="google-top-screenshot" src="google-top.jpg" alt="Google Search">

<!-- Coin area -->
<div class="coin-area" id="coinArea">
  <div class="coin-container">
    <img class="coin-sprite" id="coin" src="coin_sheet.png" alt="coin">
  </div>
  <div class="coin-label" id="coinLabel">Heads</div>

  <!-- Invisible touch zones: left=tails, right=heads -->
  <div class="touch-zones">
    <div class="touch-zone-left" id="zoneTails"></div>
    <div class="touch-zone-right" id="zoneHeads"></div>
  </div>
</div>

<!-- Flip Again screenshot (clickable, swaps during flip) -->
<div style="position:relative; line-height:0;">
  <img id="flipAgainImg" style="width:100%; display:block; transition: opacity 0.15s ease;" src="bottom-flipagain.jpg" alt="Flip Again">
  <div id="flipAgain" style="position:absolute;top:0;left:0;right:0;bottom:0;cursor:pointer;"></div>
</div>

<!-- Tools screenshot (no gap) -->
<img style="width:100%; display:block;" src="bottom-tools.jpg" alt="Tools">

<script>
  const coin = document.getElementById('coin');
  const coinLabel = document.getElementById('coinLabel');
  const flipAgainBtn = document.getElementById('flipAgain');
  const flipAgainImg = document.getElementById('flipAgainImg');
  let isFlipping = false;
  let flipDirection = 1;

  function flip(result) {
    if (isFlipping) return;
    isFlipping = true;

    coinLabel.classList.remove('visible');
    flipAgainImg.src = 'bottom-flipping.jpg';

    const animClass = flipDirection === 1 ? 'flipping-forward' : 'flipping-reverse';
    flipDirection *= -1;

    coin.classList.remove('flipping-forward', 'flipping-reverse');
    coin.style.transform = '';
    void coin.offsetWidth;
    coin.classList.add(animClass);

    setTimeout(() => {
      coin.classList.remove('flipping-forward', 'flipping-reverse');
      coin.style.transform = `translateY(${result === 'heads' ? '0px' : '-2549px'})`;
      coinLabel.textContent = result === 'heads' ? 'Heads' : 'Tails';
      coinLabel.classList.add('visible');
      flipAgainImg.src = 'bottom-flipagain.jpg';
      isFlipping = false;
    }, 1400);
  }


  document.getElementById('zoneHeads').addEventListener('click', () => flip('heads'));
  document.getElementById('zoneTails').addEventListener('click', () => flip('tails'));
  flipAgainBtn.addEventListener('click', () => {
    flip(Math.random() < 0.5 ? 'heads' : 'tails');
  });

  // Auto-flip on open
  setTimeout(() => flip(Math.random() < 0.5 ? 'heads' : 'tails'), 300);
</script>
</body>
</html>
