<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>flip a coin - Google Search</title>
<link rel="apple-touch-icon" href="icon.jpg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Google">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: arial, sans-serif;
    background: #fff;
    max-width: 430px;
    margin: 0 auto;
    overflow-x: hidden;
  }

  /* Screenshot top image */
  .google-top-screenshot {
    width: 100%;
    display: block;
  }

  /* Coin area — teal background */
  .coin-area {
    background: #48d1cc;
    min-height: 230px;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 24px 0 20px;
    position: relative; overflow: hidden;
    cursor: pointer; user-select: none;
  }

  /* Coin */
  .coin-container {
    perspective: 600px;
    width: 160px; height: 160px;
    margin-bottom: 14px;
  }
  .coin {
    width: 160px; height: 160px;
    position: relative;
    transform-style: preserve-3d;
  }
  .coin-container {
    perspective: 600px;
    width: 160px; height: 160px;
  }
  .coin {
    width: 160px; height: 160px;
    position: relative;
    transform-style: preserve-3d;
  }
  .coin.flipping-forward {
    animation: coinFlipForward 1.4s ease-in-out forwards;
  }
  .coin.flipping-reverse {
    animation: coinFlipReverse 1.4s ease-in-out forwards;
  }
  @keyframes coinFlipForward {
    0%   { transform: rotateY(0deg)    rotateX(0deg); }
    15%  { transform: rotateY(360deg)  rotateX(54deg); }
    30%  { transform: rotateY(720deg)  rotateX(108deg); }
    45%  { transform: rotateY(1080deg) rotateX(162deg); }
    50%  { transform: rotateY(1260deg) rotateX(180deg); }
    65%  { transform: rotateY(1440deg) rotateX(234deg); }
    80%  { transform: rotateY(1800deg) rotateX(288deg); }
    90%  { transform: rotateY(2040deg) rotateX(324deg); }
    100% { transform: rotateY(2160deg) rotateX(360deg); }
  }
  @keyframes coinFlipReverse {
    0%   { transform: rotateY(0deg)     rotateX(0deg); }
    15%  { transform: rotateY(-360deg)  rotateX(54deg); }
    30%  { transform: rotateY(-720deg)  rotateX(108deg); }
    45%  { transform: rotateY(-1080deg) rotateX(162deg); }
    50%  { transform: rotateY(-1260deg) rotateX(180deg); }
    65%  { transform: rotateY(-1440deg) rotateX(234deg); }
    80%  { transform: rotateY(-1800deg) rotateX(288deg); }
    90%  { transform: rotateY(-2040deg) rotateX(324deg); }
    100% { transform: rotateY(-2160deg) rotateX(360deg); }
  }

  /* Front face */
  .coin-front {
    position: absolute; width: 160px; height: 160px;
    border-radius: 50%; overflow: hidden;
    backface-visibility: hidden;
    transform: translateZ(8px);
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .coin-front img {
    width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
  }

  /* Back face */
  .coin-back {
    position: absolute; width: 160px; height: 160px;
    border-radius: 50%; overflow: hidden;
    backface-visibility: hidden;
    transform: rotateY(180deg) translateZ(8px);
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .coin-back img {
    width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
    transform: scaleX(-1); /* mirror so it reads correctly from back */
  }

  /* Edge — built from thin segments forming a cylinder */
  .coin-edge-wrap {
    position: absolute; width: 160px; height: 160px;
    transform-style: preserve-3d;
    top: 0; left: 0;
  }
  .coin-edge-seg {
    position: absolute;
    width: 16px; /* thickness of coin */
    height: 4px; /* height of each segment */
    background: linear-gradient(to bottom, #e0e0e0, #aaa, #e0e0e0);
    left: 50%; top: 50%;
    transform-origin: left center;
  }

  .coin-label {
    font-size: 22px; font-weight: 500; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.15);
    letter-spacing: 0.2px;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .coin-label.visible {
    opacity: 1;
  }

  /* Touch zones */
  .touch-zones {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; z-index: 10;
  }
  .touch-zone-left, .touch-zone-right { flex: 1; height: 100%; }

  /* Flip again */
  .flip-again {
    text-align: center; padding: 14px 16px;
    font-size: 13.5px; font-weight: 500;
    color: #1a73e8; letter-spacing: 0.8px;
    cursor: pointer; border-bottom: 1px solid #e8eaed;
    background: #fff;
  }
  .flip-again:active { background: #f1f3f4; }

  /* Tools tabs */
  .tools-tabs {
    display: flex; border-bottom: 1px solid #e8eaed;
    padding: 0 16px; background: #fff;
  }
  .tools-tab {
    flex: 1; text-align: center; padding: 12px 0;
    font-size: 11.5px; color: #5f6368; letter-spacing: 0.6px;
    text-transform: uppercase; font-weight: 500; cursor: pointer;
  }
  .tools-tab.active {
    color: #1a73e8; border-bottom: 3px solid #1a73e8;
  }

  /* Tool cards */
  .tool-cards {
    display: flex; gap: 8px; padding: 12px 12px;
    overflow-x: auto; scrollbar-width: none; background: #fff;
  }
  .tool-cards::-webkit-scrollbar { display: none; }
  .tool-card {
    min-width: 88px; height: 88px; border-radius: 12px;
    display: flex; flex-direction: column; align-items: center;
    justify-content: flex-end; padding-bottom: 10px;
    flex-shrink: 0; overflow: hidden; position: relative;
    cursor: pointer;
  }
  .card-tuner { background: linear-gradient(135deg, #e67e22, #d35400); }
  .card-calc { background: linear-gradient(135deg, #5b9bd5, #3a7fc1); }
  .card-meditate { background: linear-gradient(135deg, #6bb5e8, #4a9fd4); }
  .card-roll { background: #e8e8e8; }
  .card-label { font-size: 11px; color: #fff; font-weight: 400; z-index: 1; }
  .card-roll .card-label { color: #202124; }
  .card-icon { font-size: 34px; position: absolute; top: 10px; }

  /* Show less */
  .show-less {
    text-align: center; padding: 14px;
    font-size: 14px; color: #5f6368; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    border-top: 1px solid #e8eaed; background: #fff;
  }

  /* Bottom nav */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #fff; border-top: 1px solid #e8eaed;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 20px 24px;
    max-width: 430px; margin: 0 auto;
  }
  .nav-btn { font-size: 22px; color: #5f6368; cursor: pointer; padding: 4px; }
  .nav-plus {
    width: 36px; height: 36px; border-radius: 50%;
    border: 1.5px solid #dadce0; display: flex; align-items: center;
    justify-content: center; font-size: 20px; color: #5f6368; cursor: pointer;
  }
  .nav-tabs {
    border: 1.5px solid #5f6368; border-radius: 6px;
    padding: 2px 8px; font-size: 13px; color: #202124; font-weight: 600;
  }

</style>
</head>
<body>

<!-- Screenshot of Google top (static image) -->
<img class="google-top-screenshot" src="google-top.jpg" alt="Google Search">

<!-- Coin area -->
<div class="coin-area" id="coinArea">
  <div class="coin-container">
    <div class="coin" id="coin">
      <!-- Front face -->
      <div class="coin-front">
        <img id="coinFront" src="heads.jpg" alt="Heads">
      </div>
      <!-- Back face -->
      <div class="coin-back">
        <img id="coinBack" src="tails.jpg" alt="Tails">
      </div>
      <!-- Edge segments -->
      <div class="coin-edge-wrap" id="edgeWrap"></div>
    </div>
  </div>
  <div class="coin-label" id="coinLabel">Heads</div>

  <!-- Invisible touch zones: left=tails, right=heads -->
  <div class="touch-zones">
    <div class="touch-zone-left" id="zoneTails"></div>
    <div class="touch-zone-right" id="zoneHeads"></div>
  </div>
</div>

<!-- Flip Again screenshot (clickable, swaps during flip) -->
<div style="position:relative; line-height:0;">
  <img id="flipAgainImg" style="width:100%; display:block; transition: opacity 0.15s ease;" src="bottom-flipagain.jpg" alt="Flip Again">
  <div id="flipAgain" style="position:absolute;top:0;left:0;right:0;bottom:0;cursor:pointer;"></div>
</div>

<!-- Tools screenshot (no gap) -->
<img style="width:100%; display:block;" src="bottom-tools.jpg" alt="Tools">

<script>
  const coin = document.getElementById('coin');
  const coinLabel = document.getElementById('coinLabel');
  const coinFront = document.getElementById('coinFront');
  const coinBack = document.getElementById('coinBack');
  const flipAgainBtn = document.getElementById('flipAgain');
  const flipAgainImg = document.getElementById('flipAgainImg');
  let isFlipping = false;
  let flipDirection = 1;

  // Build edge segments
  const edgeWrap = document.getElementById('edgeWrap');
  const SEGS = 60;
  const R = 80; // radius
  const THICKNESS = 16;
  for (let i = 0; i < SEGS; i++) {
    const angle = (i / SEGS) * 360;
    const rad = (angle * Math.PI) / 180;
    const seg = document.createElement('div');
    seg.className = 'coin-edge-seg';
    seg.style.transform = `rotate(${angle}deg) translateX(${R - THICKNESS/2}px) translateY(-2px)`;
    edgeWrap.appendChild(seg);
  }

  function flip(result) {
    if (isFlipping) return;
    isFlipping = true;

    coinLabel.classList.remove('visible');
    flipAgainImg.src = 'bottom-flipping.jpg';

    const animClass = flipDirection === 1 ? 'flipping-forward' : 'flipping-reverse';
    flipDirection *= -1;

    coin.classList.remove('flipping-forward', 'flipping-reverse');
    void coin.offsetWidth;
    coin.classList.add(animClass);

    // Set front/back correctly for result
    if (result === 'heads') {
      coinFront.src = 'heads.jpg';
      coinBack.src = 'tails.jpg';
    } else {
      coinFront.src = 'tails.jpg';
      coinBack.src = 'heads.jpg';
    }

    setTimeout(() => {
      coinLabel.textContent = result === 'heads' ? 'Heads' : 'Tails';
      coinLabel.classList.add('visible');
      flipAgainImg.src = 'bottom-flipagain.jpg';

      coin.classList.remove('flipping-forward', 'flipping-reverse');
      isFlipping = false;
    }, 1400);
  }

  document.getElementById('zoneHeads').addEventListener('click', () => flip('heads'));
  document.getElementById('zoneTails').addEventListener('click', () => flip('tails'));
  flipAgainBtn.addEventListener('click', () => {
    flip(Math.random() < 0.5 ? 'heads' : 'tails');
  });

  // Auto-flip on open
  setTimeout(() => flip(Math.random() < 0.5 ? 'heads' : 'tails'), 300);
</script>
</body>
</html>
